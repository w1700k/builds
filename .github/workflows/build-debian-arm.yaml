name: Build new debian-arm container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Build and push debian-arm base image
    runs-on: ubuntu-26.04-arm
    env:
      IMAGE: ghcr.io/w1700k/fastbuild_base:debian-arm
    steps:
    - uses: actions/checkout@v7

    - uses: docker/login-action@v4
      with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}

    - name: Write Containerfile
      run: |
        cat > deb-container <<'DKR'
        FROM docker.io/debian:forky-slim

        RUN apt-get update && apt-get install --no-install-recommends --yes \
          sudo curl build-essential clang flex bison g++ gawk gcc gettext git \
          libncurses-dev libssl-dev python3-distutils-extra rsync swig unzip \
          zlib1g-dev file wget golang zstd && \
          rm -f -r '/var/lib/apt/' && \
          rm -f -r '/var/cache/apt/' && \
          useradd -m user && echo 'user ALL=NOPASSWD: ALL' > /etc/sudoers.d/user

        RUN git config --system user.name "user" && git config --system user.email "user@example.com"

        USER user

        WORKDIR /home/user
        DKR

    - name: Build image
      run: docker build --rm --pull --provenance=false --platform linux/arm64 --tag "$IMAGE" --file ./deb-container .

    - name: Push image
      run: docker push "$IMAGE"

    - name: Verify
      run: docker buildx imagetools inspect "$IMAGE"

    - name: Cleanup old ghcr images
      uses: dataaxiom/ghcr-cleanup-action@v1
      with:
        package: fastbuild_base
